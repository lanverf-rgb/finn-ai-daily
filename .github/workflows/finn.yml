name: run daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run FINN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
      - name: Commit files
        run: |
          git config --global user.name "FINN Bot"
          git config --global user.email "finn@bot.com"
          git add substack_today.md x_posts_today.md || true
          git commit -m "AI Daily $(date +%Y-%m-%d)" || true
          git push || true
